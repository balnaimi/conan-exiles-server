name: Validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release tag against VERSION
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"

      - name: Set up Node.js for Pages tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install documentation build dependency
        run: python3 -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate shell scripts
        run: |
          bash -n entrypoint.sh scripts/runtime/*.sh scripts/native/*.sh scripts/migrate-wine-to-native.sh scripts/migrate-compose-wine-to-native.sh scripts/conan-backup.sh scripts/conan-doctor.sh
          shellcheck --severity=error -x entrypoint.sh scripts/runtime/*.sh scripts/native/*.sh scripts/migrate-wine-to-native.sh scripts/migrate-compose-wine-to-native.sh scripts/conan-backup.sh scripts/conan-doctor.sh

      - name: Validate Python tooling syntax
        run: |
          python3 -m py_compile \
            scripts/build-pages-docs.py \
            scripts/conan_backup.py \
            scripts/conan_doctor.py \
            scripts/migrate_compose_wine_to_native.py \
            scripts/sync-project-version.py \
            scripts/test-backup-docker.py \
            scripts/test-compose-migration-docker.py \
            scripts/test-operations-tools.py

      - name: Test shared and Native runtime behavior
        run: |
          python3 scripts/test-runtime-config.py
          python3 scripts/test-native-runtime.py
          python3 scripts/test-native-image.py
          python3 scripts/test-compose-config.py
          python3 scripts/test-operations-tools.py

      - name: Validate release version synchronization
        run: python3 scripts/sync-project-version.py --check

      - name: Validate configuration consistency
        run: python3 scripts/validate-config-consistency.py

      - name: Test GitHub Pages UI
        run: |
          python3 scripts/build-pages-docs.py --check
          python3 scripts/test-pages-ui.py

      - name: Validate all GitHub Pages HTML
        run: npx --yes html-validate@10.9.0 "docs/**/*.html"

      - name: Test GitHub Pages in Chromium
        run: node scripts/test-pages-browser.mjs

      - name: Render Wine and Native Compose
        run: |
          cp .env.minimal .env
          trap 'rm -f .env' EXIT
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.native.yml config -q
          docker compose -f docker-compose.native.build.yml config -q

      - name: Test portable backup and restore with isolated Docker volumes
        run: python3 scripts/test-backup-docker.py

      - name: Check required files
        run: |
          test -f Dockerfile
          test -f Dockerfile.native
          test -f docker-compose.yml
          test -f docker-compose.native.yml
          test -f docker-compose.native.build.yml
          test -f .env.example
          test -f docs/index.html
          test -f scripts/validate-config-consistency.py
          test -f scripts/test-runtime-config.py
          test -f scripts/test-native-runtime.py
          test -f scripts/test-native-image.py
          test -f scripts/test-compose-config.py
          test -f scripts/migrate-compose-wine-to-native.sh
          test -f scripts/migrate_compose_wine_to_native.py
          test -f scripts/test-compose-migration-docker.py
          test -f scripts/conan-backup.sh
          test -f scripts/conan_backup.py
          test -f scripts/conan-doctor.sh
          test -f scripts/conan_doctor.py
          test -f scripts/test-operations-tools.py
          test -f scripts/test-backup-docker.py
          test -f scripts/sync-project-version.py
          test -f VERSION
          test -f scripts/build-pages-docs.py
          test -f scripts/test-pages-ui.py
          test -f scripts/test-pages-browser.mjs
          test -f docs/config/index.html
          test -f docs/docs/index.html
          test -f docs/migrate/index.html
          test -f docs/assets/favicon.svg

      - name: Check whitespace
        run: git diff --check
