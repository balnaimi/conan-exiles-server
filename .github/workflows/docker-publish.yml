name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: docker-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    name: Detect runtime changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      wine: ${{ steps.filter.outputs.wine }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release tag against VERSION
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          version_pattern='[0-9]+\.[0-9]+\.[0-9]+'
          [[ "$version" =~ ^${version_pattern}$ ]] || {
            printf 'Invalid VERSION: %q\n' "$version" >&2
            exit 1
          }
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            expected="v${version}"
            test "${GITHUB_REF_NAME}" = "${expected}" || {
              printf 'Tag %s does not match VERSION (%s)\n' "${GITHUB_REF_NAME}" "${expected}" >&2
              exit 1
            }
          fi

      - name: Detect image inputs
        id: filter
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050 # v3
        with:
          filters: |
            wine:
              - 'Dockerfile'
              - '.dockerignore'
              - 'entrypoint.sh'
              - 'scripts/runtime/**'
              - '.github/workflows/docker-publish.yml'
            native:
              - 'Dockerfile.native'
              - '.dockerignore'
              - 'scripts/native/**'
              - 'scripts/runtime/**'
              - '.github/workflows/docker-publish.yml'

  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: wine-compatible
            change_filter: wine
            dockerfile: Dockerfile
            channel: latest
            semver_suffix: ''
            sha_suffix: ''
            title: Conan Exiles Enhanced Dedicated Server — Wine Compatibility
            description: Wine runtime for existing deployments and backward compatibility; use Native Linux for new servers
            runtime: wine
            support_tier: existing-deployments
            installation_track: compatibility
            default_runtime: 'true'
          - variant: native-recommended
            change_filter: native
            dockerfile: Dockerfile.native
            channel: native
            semver_suffix: -native
            sha_suffix: -native
            title: Conan Exiles Enhanced Dedicated Server — Native Linux Recommended
            description: Native Linux recommended for new servers and every new installation
            runtime: native-linux
            support_tier: recommended
            installation_track: new-servers
            default_runtime: 'false'

    name: Build ${{ matrix.variant }} image

    steps:
      - name: Checkout
        if: ${{ startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs[matrix.change_filter] == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        if: ${{ startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs[matrix.change_filter] == 'true' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs[matrix.change_filter] == 'true') }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract ${{ matrix.variant }} metadata
        id: meta
        if: ${{ startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs[matrix.change_filter] == 'true' }}
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.channel }},enable={{is_default_branch}}
            type=semver,pattern={{version}}${{ matrix.semver_suffix }}
            type=sha,suffix=${{ matrix.sha_suffix }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            com.balnaimi.conan.runtime=${{ matrix.runtime }}
            com.balnaimi.conan.support-tier=${{ matrix.support_tier }}
            com.balnaimi.conan.installation-track=${{ matrix.installation_track }}
            com.balnaimi.conan.default=${{ matrix.default_runtime }}

      - name: Build one immutable ${{ matrix.variant }} artifact
        id: build-scan
        if: ${{ startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs[matrix.change_filter] == 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: ${{ github.event_name == 'pull_request' }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) || '' }}
          tags: ${{ github.event_name == 'pull_request' && format('conan-ci:{0}', matrix.variant) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Scan exact image artifact for fixed high-impact vulnerabilities
        if: ${{ startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs[matrix.change_filter] == 'true' }}
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ github.event_name == 'pull_request' && format('conan-ci:{0}', matrix.variant) || format('{0}/{1}@{2}', env.REGISTRY, env.IMAGE_NAME, steps.build-scan.outputs.digest) }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Promote scanned digest to release and channel tags
        if: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs[matrix.change_filter] == 'true') }}
        shell: bash
        env:
          SOURCE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-scan.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            test -n "$tag" && args+=(--tag "$tag")
          done <<< "$TAGS"
          test "${#args[@]}" -gt 0
          docker buildx imagetools create "${args[@]}" "$SOURCE"
