name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: wine-stable
            dockerfile: Dockerfile
            channel: latest
            semver_suffix: ''
            sha_suffix: ''
            title: Conan Exiles Enhanced Dedicated Server — Wine Stable
            description: Project stable/default Wine runtime; Native Linux is a separate experimental image
            runtime: wine
            support_tier: stable
            default_runtime: 'true'
          - variant: native-experimental
            dockerfile: Dockerfile.native
            channel: native
            semver_suffix: -native
            sha_suffix: -native
            title: Conan Exiles Enhanced Dedicated Server — Native Linux Experimental
            description: Experimental opt-in Native Linux runtime; Wine remains the stable/default image
            runtime: native-linux
            support_tier: experimental
            default_runtime: 'false'

    name: Build ${{ matrix.variant }} image

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract ${{ matrix.variant }} metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.channel }},enable={{is_default_branch}}
            type=semver,pattern={{version}}${{ matrix.semver_suffix }}
            type=sha,suffix=${{ matrix.sha_suffix }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            com.balnaimi.conan.runtime=${{ matrix.runtime }}
            com.balnaimi.conan.support-tier=${{ matrix.support_tier }}
            com.balnaimi.conan.default=${{ matrix.default_runtime }}

      - name: Build and push ${{ matrix.variant }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          provenance: mode=max
          sbom: true
