# Conan Exiles Enhanced — Native Linux — Recommended for New Servers
# RECOMMENDED NATIVE LINUX RUNTIME for every new installation and new server.
# This file uses :native and separate Native-only volumes.
# Never replace these volumes with existing Wine volumes. Back up and use the
# documented dry-run migration helper for an existing server.
# Default host ports match Wine, so only one default-port runtime can run at a
# time; Docker rejects the second port bind before its container starts.
# Native quick start: docker compose -f docker-compose.native.yml up -d
services:
  conan-native:
    platform: linux/amd64
    image: ghcr.io/balnaimi/conan-exiles-server:native
    container_name: conan-exiles-enhanced-native
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    env_file: .env
    labels:
      org.opencontainers.image.title: "Conan Exiles Enhanced — Native Linux — Recommended for New Servers"
      com.balnaimi.conan.runtime: "native-linux"
      com.balnaimi.conan.support-tier: "recommended"
      com.balnaimi.conan.installation-track: "new-servers"
      com.balnaimi.conan.default: "false"
    ports:
      - "${SERVER_PORT:-7777}:${SERVER_PORT:-7777}/udp"
      - "7778:7778/udp"
      - "${QUERY_PORT:-27015}:${QUERY_PORT:-27015}/udp"
    volumes:
      - native-game-data:/data/server
      - native-save-data:/data/server/ConanSandbox/Saved
      - native-steam-data:/data/steam
      - native-backups:/data/backups
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    ulimits:
      nofile:
        soft: 100000
        hard: 100000

volumes:
  native-game-data:
  native-save-data:
  native-steam-data:
  native-backups:
